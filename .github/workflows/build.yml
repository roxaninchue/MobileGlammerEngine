name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S engine -B build -DMGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (demo scene, headless)
        run: ./build/mge_bench 600 15 build/bench.json && cat build/bench.json

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; setup-android@v3 asks for the removed 'tools' package and fails.
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Maven Central fetches occasionally fail on hosted runners (seen: junit:junit:4.13.2 not
      # resolved). Resolve the unit-test classpath up front, retrying with backoff, so a flaky
      # download does not fail the build.
      - name: Resolve unit-test dependencies (with retries)
        run: |
          for attempt in 1 2 3; do
            if gradle :app:dependencies --configuration debugUnitTestRuntimeClasspath --refresh-dependencies --stacktrace > deps.log 2>&1; then
              echo "dependencies resolved (attempt $attempt)"; exit 0
            fi
            echo "dependency resolution failed (attempt $attempt), retrying in $((attempt * 20)) s"
            grep -E "What went wrong|Could not|> |Caused by" deps.log | head -40 || true
            sleep $((attempt * 20))
          done
          echo "dependency resolution failed after 3 attempts; full log of the last one:"
          tail -150 deps.log
          exit 1
      - name: App unit tests (editor UI model)
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
