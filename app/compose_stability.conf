// Compose stability (see app/build.gradle.kts): the editor's UI model is immutable data parsed
// from the engine's state JSON, so panels can skip recomposition when it has not changed.
// Without this, the List fields make every model class "unstable" and the whole editor
// overlay recomposes on any unrelated state change (it hitched scrolling every 500 ms).
com.glammer.mge.editor.*
kotlin.collections.List
